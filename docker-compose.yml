services:
  postgres:
    image: postgres:16-alpine
    container_name: table-planning-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_planner}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_planner}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant_planner} -d ${POSTGRES_DB:-restaurant_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: table-planning-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/restaurant_planner}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-restaurant_planner}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-restaurant_planner}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-change-me-in-production-change-me-in-production}
      APP_SECURITY_JWT_ACCESS_TOKEN_TTL: ${APP_SECURITY_JWT_ACCESS_TOKEN_TTL:-PT15M}
      APP_SECURITY_JWT_REFRESH_TOKEN_TTL: ${APP_SECURITY_JWT_REFRESH_TOKEN_TTL:-P14D}
      APP_NOTIFICATION_SMS_ENABLED: ${APP_NOTIFICATION_SMS_ENABLED:-false}
      APP_NOTIFICATION_SMS_PROVIDER: ${APP_NOTIFICATION_SMS_PROVIDER:-fake}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-Demo Owner}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-demo@restaurant.com}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-Demo1234!}
      APP_BOOTSTRAP_RESTAURANT_NAME: ${APP_BOOTSTRAP_RESTAURANT_NAME:-Demo Restaurant}
      APP_BOOTSTRAP_RESTAURANT_SLUG: ${APP_BOOTSTRAP_RESTAURANT_SLUG:-demo-restaurant}
      APP_BOOTSTRAP_RESTAURANT_TIMEZONE: ${APP_BOOTSTRAP_RESTAURANT_TIMEZONE:-Europe/Madrid}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: table-planning-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8080/ws}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres-data:
