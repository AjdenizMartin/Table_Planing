services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - pilot_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/postgres_password
      APP_SECURITY_JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_SECURITY_CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      APP_SECURITY_JWT_ACCESS_TOKEN_TTL: PT15M
      APP_SECURITY_JWT_REFRESH_TOKEN_TTL: P14D
      APP_NOTIFICATION_SMS_ENABLED: "false"
      APP_NOTIFICATION_SMS_PROVIDER: fake
    secrets:
      - postgres_password
      - jwt_secret
    networks:
      - pilot_internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${LETSENCRYPT_DIR:-./deploy/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT_DIR:-./deploy/certbot-www}:/var/www/certbot:ro
    networks:
      - pilot_internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres-prod-data:

networks:
  pilot_internal:
    internal: true

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}
  jwt_secret:
    file: ${JWT_SECRET_FILE:-./secrets/jwt_secret.txt}
